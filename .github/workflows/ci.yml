name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, clippy and tests (Windows)
    # The code only builds on Windows (WASAPI, Credential Manager, registry).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --release --locked -- -D warnings

      - name: Tests
        run: cargo test --release --locked
