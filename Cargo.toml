[package]
name = "flowpause"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
keyring = "4.2.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
