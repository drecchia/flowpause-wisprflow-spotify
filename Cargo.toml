[package]
name = "flowpause"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.10", features = ["derive"] }
keyring = "4.2.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_Security"] }
windows-core = "0.62"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
